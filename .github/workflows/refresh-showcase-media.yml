name: Refresh showcase media

on:
  push:
    branches:
      - fix/event-images-and-copy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-images-and-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare resilient event image lookup
        run: node scripts/patch-refresh.mjs
      - name: Refresh event images and copy
        id: migrate
        continue-on-error: true
        run: node scripts/refresh-showcase-media.mjs
      - name: Audit completed migration
        if: steps.migrate.outcome == 'success'
        run: node scripts/audit-images.mjs
      - name: Commit migration progress
        if: always()
        run: |
          if git diff --quiet -- feeds README.md scripts/audit-images.mjs; then
            echo "No migration changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feeds README.md scripts/audit-images.mjs
            git commit -m "fix: replace remaining placeholder event imagery"
            git push
          fi
      - name: Require complete migration
        if: steps.migrate.outcome != 'success'
        run: exit 1
