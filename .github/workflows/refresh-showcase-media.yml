name: Refresh showcase media

on:
  push:
    branches:
      - fix/event-images-and-copy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-images-and-copy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh event images and copy
        run: node scripts/refresh-showcase-media.mjs
      - name: Audit images
        run: node scripts/audit-images.mjs
      - name: Commit generated feed updates
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds README.md scripts/audit-images.mjs
          git commit -m "fix: replace remaining placeholder event imagery"
          git push
