  - id: bloomsday-2027
    title:
      zh-CN: 布鲁姆日
      en: Bloomsday 2027
    summary:
      zh-CN: 在《尤利西斯》故事发生日重走都柏林。
      en: Retrace Dublin on the day when Ulysses takes place.
    description:
      zh-CN: 不必读完全书；听一段朗读或找一处作品中的地点即可。
      en: You need not finish the novel; hear a reading or find one place from it.
