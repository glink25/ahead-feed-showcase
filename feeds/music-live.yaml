  - id: world-opera-day-2026
    title:
      zh-CN: 世界歌剧日
      en: World Opera Day 2026
    summary:
      zh-CN: 世界各地歌剧机构共同庆祝。
      en: Opera organizations around the world celebrate together.
    description:
      zh-CN: 不用先懂歌剧史。找一段从没听过的咏叹调，把音量开大一点；也许三分钟后，你就多了一个会反复播放的片段。
      en: You do not need an opera history lesson first. Pick an aria you have never heard, turn it up a little, and you may have a new replay favorite three minutes later.
    schedule:
