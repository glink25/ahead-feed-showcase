  - id: eurovision-final-2027
    title:
      zh-CN: 欧洲歌唱大赛决赛
      en: Eurovision 2027 Final
    summary:
      zh-CN: 舞台、歌曲和计分悬念汇聚的一晚。
      en: A night of staging, songs, and suspenseful voting.
    description:
      zh-CN: 有人等歌，有人等舞台，有人只想看最后那张不断翻盘的计分板。具体日期尚待主办方最终确认，当前采用预期五月窗口中的日期。
      en: Some come for the songs, some for the staging, and some mostly for the scoreboard drama at the end. The organizer has yet to confirm the exact date; this uses a likely May date.
