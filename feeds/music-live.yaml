  - id: record-store-day-2027
    title:
      zh-CN: 唱片店日
      en: Record Store Day 2027
    summary:
      zh-CN: 独立唱片店与限量发行的一天。
      en: A day for independent record shops and special releases.
    description:
      zh-CN: 先等今年的特别发行清单，再给自己留一点时间慢慢翻架子。真正好玩的往往不是“买到计划里的那张”，而是顺手遇见一张没想到会带回家的唱片。
      en: Wait for the special-release list, then leave yourself time to browse slowly. The fun is often not finding the record you planned to buy, but the one you never expected to take home.
    schedule:
