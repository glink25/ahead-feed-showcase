  - id: make-music-day-2027
    title:
      zh-CN: 世界音乐日
      en: Make Music Day 2027
    summary:
      zh-CN: 6 月 21 日，任何水平都可以发出声音。
      en: On June 21, music-makers of every level can make some noise.
    description:
      zh-CN: 这一天不太讲究“够不够专业”。去听一场街角免费演出，或者真的把窗台、客厅、楼下空地变成一个十分钟的小舞台。
      en: This day is not very interested in whether you are professional enough. Catch a free street performance, or turn a windowsill, living room, or patch of pavement into a ten-minute stage of your own.
    schedule:
      - id: published-date
