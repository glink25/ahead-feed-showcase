  - id: new-year-concert-2027
    title:
      zh-CN: 维也纳新年音乐会
      en: Vienna New Year’s Concert 2027
    summary:
      zh-CN: 从金色大厅开始新一年。
      en: Begin the year with music from the Golden Hall.
    description:
      zh-CN: 新年的第一天，金色大厅亮起来，圆舞曲一响，哪怕隔着屏幕也很有“这一年正式开始了”的仪式感。提前看看你所在地区的转播安排就好。
      en: On the first day of the year, the Golden Hall lights up and the first waltz makes the new year feel properly underway, even through a screen. Check local broadcast details in advance.
    schedule:
      - id: published-date
        value:
          kind: exact
