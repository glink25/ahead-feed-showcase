  - id: roman-l2-arrival-2026
    title:
      zh-CN: Roman 太空望远镜抵达日地 L2
      en: Roman Space Telescope Reaches Sun-Earth L2
    summary:
      zh-CN: Roman 已于 2026 年 8 月 30 日发射，NASA 表示它将经历约三个月、约一百万英里的旅程前往最终轨道。
      en: Roman launched on Aug. 30, 2026 and is on an approximately three-month, million-mile journey to its final orbit.
    schedule:
      - id: expected-arrival-month
        value: { kind: month, year: 2026, month: 11 }
        recordedAt: '2026-09-07T00:00:00Z'
        confidence: likely
        source: NASA
    tags: [space, science]
    evidence:
      - kind: url
        value: https://www.nasa.gov/news-release/nasas-dark-universe-seeking-nancy-grace-roman-space-telescope-launches/
        label: { zh-CN: NASA 发射后任务说明, en: NASA post-launch mission update }
      - kind: url
        value: https://commons.wikimedia.org/wiki/File:Nancy_Grace_Roman_Space_Telescope_Prelaunch_(NHQ202608290004).jpg
        label: { zh-CN: 海报图片来源, en: Poster image source }
