  - id: artemis-iii-2027
    title:
      zh-CN: Artemis III 载人测试飞行
      en: Artemis III Crewed Demonstration Flight
    summary:
      zh-CN: 四名宇航员将在近地轨道验证 Orion 与商业载人登月器会合、对接等未来登月关键能力。
      en: Four astronauts will demonstrate rendezvous and docking between Orion and commercial human landing systems in low Earth orbit.
