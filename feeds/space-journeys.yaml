  - id: cosi-launch-2027
    title:
      zh-CN: COSI 伽马射线望远镜发射
      en: COSI Gamma-Ray Telescope Launches
    summary:
      zh-CN: NASA 的 COSI 将用全天巡天研究反物质湮灭、核合成和高能天体，当前目标是 2027 年 8 月发射。
      en: NASA's COSI will survey gamma rays from antimatter annihilation, nucleosynthesis and energetic sources, targeting an August 2027 launch.
    schedule:
      - id: targeted-month
        value: { kind: month, year: 2027, month: 8 }
        recordedAt: '2026-09-07T00:00:00Z'
        confidence: confirmed
        source: NASA
