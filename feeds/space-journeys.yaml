      zh-CN: NEO Surveyor 行星防御望远镜发射
      en: NEO Surveyor Planetary Defense Telescope Launches
    summary:
      zh-CN: NASA 首个专门为寻找潜在危险小行星和彗星设计的太空望远镜计划不早于 2027 年 9 月发射。
      en: NASA's first space telescope purpose-built to find potentially hazardous asteroids and comets is scheduled no earlier than September 2027.
