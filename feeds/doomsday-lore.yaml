  - id: doomsday-clock-2027
    title:
      zh-CN: 2027 末日钟公布窗口
      en: Expected 2027 Doomsday Clock Update
    summary:
      zh-CN: 末日钟是风险警示符号，并不是倒计时预言。
      en: The Doomsday Clock is a risk-warning symbol, not a countdown prophecy.
    description:
      zh-CN: 等科学家公布新读数，也看看他们对核风险、气候与技术提出什么行动建议。
      en: Await the new setting and the actions scientists recommend on nuclear, climate, and technology risks.
