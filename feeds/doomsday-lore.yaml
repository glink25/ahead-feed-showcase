  - id: yr4-safe-passage-2032
    title:
      zh-CN: 小行星 2024 YR4 安全掠过日
      en: Asteroid 2024 YR4 Safe-Passage Day
    summary:
      zh-CN: 它曾触发真实风险关注，但后续观测已排除 2032 年撞击地球。
      en: It once triggered real concern, but later observations ruled out a 2032 Earth impact.
    description:
      zh-CN: 这一天值得期待的不是撞击，而是行星防御如何用更多数据消除恐慌。
      en: What is worth awaiting is not impact, but how planetary defense uses better data to replace fear.
    schedule:
