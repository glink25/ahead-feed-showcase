  - id: asteroid-prophecy-2026
    title:
      zh-CN: “2026 小行星末日”预言核销日
      en: Checking the “2026 Asteroid Apocalypse” Claim
    summary:
      zh-CN: 宗教团体曾转述 2026 年小行星毁灭世界的说法，没有科学证据。
      en: A religious group repeated a claim that an asteroid would end the world in 2026; there is no scientific evidence.
    description:
      zh-CN: 年底回来核销这条预言。现实中的近地天体风险应以 NASA、ESA 等监测机构为准。
      en: Return at year-end to close out the claim. Use NASA and ESA monitoring for real near-Earth-object risks.
    schedule:
      - id: published-date
        value:
          kind: exact
          date: '2026-12-31'
        recordedAt: '2026-09-05T00:00:00Z'
        confidence: confirmed
        source: NASA CNEOS 风险监测
        evidence:
