  - id: newton-2060
    title:
      zh-CN: 牛顿的“2060 之后”推算
      en: Newton’s “After 2060” Calculation
    summary:
      zh-CN: 牛顿私人手稿中的宗教年代推算常被误传成精确末日预言。
      en: A religious chronology in Newton’s private notes is often misreported as an exact doomsday prediction.
    description:
      zh-CN: 他写的是世界不会在 2060 年以前终结，而不是给出 2060 年某日的倒计时。
      en: He argued the end would not come before 2060; he did not provide a countdown to a day in 2060.
    schedule:
      - id: published-date
        value:
          kind: year
          year: 2060
        recordedAt: '2026-09-05T00:00:00Z'
        confidence: likely
        source: The Newton Project
