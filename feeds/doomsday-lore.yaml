  - id: year-2038-problem
    title:
      zh-CN: 2038 年时间溢出时刻
      en: Year 2038 Time Rollover
    summary:
      zh-CN: 部分旧式 32 位系统无法正确表示这一时刻之后的 Unix 时间。
      en: Some legacy 32-bit systems cannot represent Unix time after this moment.
    description:
      zh-CN: 它更像一张给工程师的超长期 TODO，而不是末日预告：最好在那一秒到来前，相关系统早已没人需要担心。
      en: It is a very long-term engineering TODO, not a doomsday prophecy. Ideally, by that second, affected systems will already be boringly fixed.
    schedule:
      - id: published-date
        value:
          kind: datetime
          dateTime: '2038-01-19T03:14:08Z'
