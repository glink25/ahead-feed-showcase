  - id: year-2038-problem
    title:
      zh-CN: 2038 年时间溢出时刻
      en: Year 2038 Time Rollover
    summary:
      zh-CN: 部分旧式 32 位系统无法正确表示这一时刻之后的 Unix 时间。
      en: Some legacy 32-bit systems cannot represent Unix time after this moment.
    description:
      zh-CN: 这是工程迁移期限，不是世界末日；现代系统应在此之前完成兼容处理。
      en: This is an engineering migration deadline, not the end of the world; affected systems should be fixed beforehand.
    schedule:
      - id: published-date
        value:
          kind: exact
          date: '2038-01-19'
        recordedAt: '2026-09-05T00:00:00Z'
        confidence: confirmed
