    summary:
      zh-CN: 一二月通常是薄水覆盖盐壳、天空与地面连成一片的最佳机会；镜面依然取决于雨量与风。
      en: January and February usually offer the best chance for a thin sheet of water to turn the salt flat into a mirror, still dependent on rain and wind.
