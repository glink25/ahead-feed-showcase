id: ahead-photo-windows
name:
  zh-CN: 一年只出现几天的画面
  en: A Few Days for the Shot
description:
  zh-CN: 光线、天气、动物与地形共同制造的短暂摄影窗口；能等，但不能假装自然会配合。
  en: Brief photography windows created by light, weather, wildlife and landscape, without pretending nature is exact.
primaryLanguage: zh-CN
