      zh-CN: 地狱谷雪猴泡温泉窗口
      en: Jigokudani Snow Monkey Hot-Spring Season
    summary:
      zh-CN: 十二月至三月通常最容易拍到日本猕猴在雪地温泉中取暖，是否下水仍由猴子自己决定。
      en: December through March is usually the best time to photograph Japanese macaques bathing in the hot springs, although the monkeys choose when to enter.
