  - id: national-day-cn-2026
    title:
      zh-CN: 2026 国庆节假期
      en: China National Day Holiday 2026
    summary:
      zh-CN: 七天假期；9 月 20 日、10 月 10 日补班。
      en: Seven days off; Sep 20 and Oct 10 are adjusted workdays.
    description:
      zh-CN: 七天长假很诱人，但它只属于 2026 年这张日历；出发前也把两个补班日一起记上。
      en: A seven-day break is tempting, but it belongs to the 2026 calendar only—mark the two adjusted workdays before making plans.
