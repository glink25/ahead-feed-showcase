  - id: labour-day-cn-2026
    title:
      zh-CN: 2026 劳动节假期
      en: China Labour Day Holiday 2026
    summary:
      zh-CN: 放假五天，5 月 9 日补班。
      en: Five days off; May 9 is an adjusted workday.
    description:
      zh-CN: 五天够安排一次小旅行，也够什么都不安排。唯一别忘的是 5 月 9 日还要补班。
      en: Five days is enough for a small trip—or for no plan at all. Just remember the adjusted workday on May 9.
