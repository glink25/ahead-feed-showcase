  - id: labour-day-cn-2026
    title:
      zh-CN: 2026 劳动节假期
      en: China Labour Day Holiday 2026
    summary:
      zh-CN: 放假五天，5 月 9 日补班。
      en: Five days off; May 9 is an adjusted workday.
