  - id: new-year-cn-2026
    title:
      zh-CN: 2026 元旦假期
      en: China New Year Holiday 2026
    summary:
      zh-CN: 放假三天，1 月 4 日补班。
      en: Three days off; Jan 4 is an adjusted workday.
    description:
      zh-CN: 三天不算长，但足够把闹钟关掉、见见人，也给新一年留一个不那么匆忙的开头。
      en: Three days is not long, but it is enough to turn off the alarm, see someone you miss, and let the new year begin without rushing.
