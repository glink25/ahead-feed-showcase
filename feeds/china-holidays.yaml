  - id: spring-festival-cn-2026
    title:
      zh-CN: 2026 春节假期
      en: China Spring Festival Holiday 2026
    summary:
      zh-CN: 九天假期；2 月 14 日、28 日补班。
      en: Nine days off; Feb 14 and 28 are adjusted workdays.
    description:
      zh-CN: 九天假期很适合回家，也很适合提前想清楚哪两天还要补班——团圆和日历都别落下。
      en: Nine days leaves room to go home; just remember the two adjusted workdays too. Keep both the reunion and the calendar in view.
