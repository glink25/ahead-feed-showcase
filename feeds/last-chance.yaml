id: ahead-last-chance
name:
  zh-CN: 趁它还在
  en: While It Is Still Here
description:
  zh-CN: 最后运营、搬迁、长期闭馆与展览闭幕。不是等它来，而是提醒自己别错过最后一次。
  en: "Final rides, relocations, long closures and exhibition endings: not waiting for arrival, but making time before something disappears."
