  - id: bastille-day-2027
    title:
      zh-CN: 法国国庆日
      en: Bastille Day 2027
    summary:
      zh-CN: 烟花、舞会与公共庆典。
      en: Fireworks, dances, and public celebrations.
    description:
      zh-CN: 白天有阅兵和街头活动，夜里常把期待留给烟花。临近 7 月 14 日时，可以顺手看看巴黎和法国各地又公布了哪些免费节目。
      en: The day brings parades and street events, while the night often belongs to fireworks. As July 14 approaches, check what free programs Paris and cities across France have announced.
