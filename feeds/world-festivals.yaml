  - id: matariki-2027
    title:
      zh-CN: 毛利新年 Matariki
      en: Matariki 2027
    summary:
      zh-CN: 在南半球冬季迎接昴星团归来。
      en: Welcome the return of the Pleiades in the Southern Hemisphere winter.
    description:
      zh-CN: 冬夜里抬头找一簇熟悉的星，再一起吃饭、讲故事、想想过去，也给接下来的一年留一个愿望。
      en: Look up on a winter night for a familiar cluster of stars, then share food and stories, remember what has passed, and make room for a hope for the year ahead.
