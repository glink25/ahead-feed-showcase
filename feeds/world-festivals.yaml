  - id: diwali-2026
    title:
      zh-CN: 排灯节
      en: Diwali 2026
    summary:
      zh-CN: 点亮灯火迎接印度重要节日。
      en: Light lamps for one of India’s major festivals.
    description:
      zh-CN: 天一黑，小小的油灯就会一盏盏亮起来。日期采用印度政府年度假日日历；不同地区的庆祝方式各有自己的味道。
      en: As dusk falls, little oil lamps begin to glow one by one. The date follows India’s official annual calendar, while traditions vary by region.
    schedule:
