  - id: carnival-rio-2027
    title:
      zh-CN: 里约狂欢节
      en: Rio Carnival 2027
    summary:
      zh-CN: 桑巴、花车与街头庆祝汇聚里约。
      en: Samba, floats, and street celebrations converge in Rio.
    description:
      zh-CN: 鼓点一响，整座城市像突然把音量拧到了最大。就算不在里约，也值得等一晚桑巴大道的巡游影像和冠军揭晓。
      en: Once the drums kick in, the whole city seems to turn the volume all the way up. Even from afar, the Sambadrome parade and champion reveal are worth waiting for.
    schedule:
      - id: published-date
