  - id: orionids-2026
    title:
      zh-CN: 猎户座流星雨极大夜
      en: Orionids Peak 2026
    summary:
      zh-CN: 哈雷彗星留下的尘埃划过夜空。
      en: Dust from Halley’s Comet streaks across the sky.
    description:
      zh-CN: 10 月 21 日夜至 22 日清晨，找远离灯光且视野开阔处。
      en: On Oct 21–22, find a dark place with a broad view of the sky.
