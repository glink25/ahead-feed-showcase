  - id: sendai-tanabata-2027
    title:
      zh-CN: 仙台七夕祭
      en: Sendai Tanabata Festival 2027
    summary:
      zh-CN: 仙台在 8 月 6–8 日举行大型七夕装饰庆典。
      en: Sendai holds its large decorated Tanabata festival on August 6–8.
    description:
      zh-CN: 走进商店街后，头顶会被巨大的彩纸流苏占满，风一吹就像整条街在缓慢摆动。这个七夕，最适合一路仰着头走。
      en: Step into the shopping streets and giant paper streamers fill the space overhead, swaying slowly whenever the wind moves through. This is a Tanabata best experienced looking up.
