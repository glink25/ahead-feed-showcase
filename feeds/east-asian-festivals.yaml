  - id: hina-matsuri-2027
    title:
      zh-CN: 女儿节
      en: Hina Matsuri 2027
    summary:
      zh-CN: 日本每年 3 月 3 日的偶人节。
      en: Japan’s annual doll festival on March 3.
    description:
      zh-CN: 红毯阶梯上，一层层摆好穿着宫廷服饰的人偶，旁边常点缀桃花。它更像一个安静、精致的春日仪式，而不是热闹的庙会。
      en: Tiered dolls in court dress sit on bright red platforms, often beside peach blossoms. It feels more like a quiet, carefully arranged spring ritual than a noisy street festival.
    schedule:
