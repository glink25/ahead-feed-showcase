  - id: hangeul-day-2026
    title:
      zh-CN: 韩文日
      en: Hangeul Day 2026
    summary:
      zh-CN: 庆祝韩文字母创制。
      en: A celebration of the creation of the Korean alphabet.
    description:
      zh-CN: 不妨挑一个你喜欢的韩语词，把它拆成几个字母看看——平时熟悉的方块字，会突然露出很巧妙的结构。
      en: Pick a Korean word you like and break it into its letters; a familiar square block suddenly reveals a surprisingly elegant structure.
