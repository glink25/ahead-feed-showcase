  - id: tanabata-2027
    title:
      zh-CN: 七夕
      en: Tanabata 2027
    summary:
      zh-CN: 把愿望写在纸条上，挂到竹枝。
      en: Write a wish on a paper strip and hang it from bamboo.
    description:
      zh-CN: 找张小纸条，认真写一个愿望，再把它挂上竹枝。不同城市会在七月或八月庆祝，这里采用常见的 7 月 7 日。
      en: Write down one wish you actually mean and hang it from bamboo. Different cities celebrate in July or August; this entry uses the common July 7 date.
