  - id: chuseok-2026
    title:
      zh-CN: 韩国秋夕
      en: Korean Chuseok 2026
    summary:
      zh-CN: 三天团聚与祭祖假期。
      en: A three-day holiday for family reunions and remembrance.
    description:
      zh-CN: 很多人会赶回家吃一顿团圆饭，也会去祭祖、做松饼。若这几天在韩国旅行，交通和营业时间值得提前多看一眼。
      en: Many people head home for family meals, remembrance rituals, and songpyeon. If you are traveling in Korea, transport and opening hours deserve an early check.
