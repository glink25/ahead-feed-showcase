      en: Christmas
    summary:
      zh-CN: 每年十二月二十五日。
      en: December 25th every year.
    description:
      zh-CN: 哪怕不过圣诞，也很难完全绕开街灯、树、歌单和年末那点“今年快结束了”的气氛。
      en: Even if you do not celebrate Christmas, it is hard to miss the lights, trees, playlists, and the feeling that the year is nearly done.
