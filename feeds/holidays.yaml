    title:
      zh-CN: 2026 年中秋节
      en: Mid-Autumn Festival 2026
    summary:
      zh-CN: 农历八月十五。
      en: The fifteenth day of the eighth lunar month.
    description:
      zh-CN: 月亮每年都会来，但一起抬头的人未必都在身边——这大概就是中秋最值得等的部分。
      en: The Moon returns every year; the people looking up with you may not always be nearby. That is part of what makes Mid-Autumn worth waiting for.
