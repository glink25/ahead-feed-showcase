  - id: gta-vi
    title:
      zh-CN: 《侠盗猎车手 VI》正式发售
      en: Grand Theft Auto VI Release
    summary:
      zh-CN: 系列正统续作，档期两度调整。
      en: The next mainline entry, delayed twice.
    description:
      zh-CN: 从最初的 2025 年窗口一路推到 2026 年下半年，是观察「日期如何逐渐确定」的最佳样本。
      en: Slipped from a 2025 window into late 2026 - a good sample of how dates firm up over time.
    schedule:
      - id: initial-window
        value:
          kind: year
          year: 2025
        recordedAt: '2024-05-17T00:00:00Z'
        confidence: rumored
        source: 发行商财报电话会议
      - id: narrowed-to-q2
        value:
          kind: quarter
          year: 2026
          quarter: 2
        recordedAt: '2025-05-02T00:00:00Z'
        confidence: likely
        source: 官方公告
      - id: delayed-to-q4
        value:
          kind: quarter
          year: 2026
          quarter: 4
        recordedAt: '2026-05-06T00:00:00Z'
        confidence: likely
        source: 官方公告
        evidence:
          - kind: url
            value: https://www.rockstargames.com/newswire
            label:
              zh-CN: 官方 Newswire 延期说明
              en: Official newswire delay note
    tags:
      - games
    evidence:
      - kind: url
        value: https://www.rockstargames.com
        label:
          zh-CN: 官方网站
          en: Official site
      - kind: note
