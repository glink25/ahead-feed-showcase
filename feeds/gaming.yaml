  - id: gta-vi
    title:
      zh-CN: 《侠盗猎车手 VI》正式发售
      en: Grand Theft Auto VI Release
    summary:
      zh-CN: 系列正统续作，档期两度调整。
      en: The next mainline entry, delayed twice.
    description:
      zh-CN: 档期一改再改，反而更像真实的等待：先别替官方猜日期，等下一次 Newswire 把窗口再钉牢一点。
      en: "The shifting window is part of the wait: do not guess for Rockstar; let the next Newswire update make the date firmer."
    schedule:
      - id: initial-window
        value:
          kind: year
          year: 2025
        recordedAt: '2024-05-17T00:00:00Z'
        confidence: rumored
        source: 发行商财报电话会议
      - id: narrowed-to-q2
        value:
          kind: quarter
          year: 2026
          quarter: 2
        recordedAt: '2025-05-02T00:00:00Z'
        confidence: likely
