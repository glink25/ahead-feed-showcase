  - id: zelda-ocarina-of-time-switch2
    title:
      zh-CN: 《塞尔达传说：时之笛》Nintendo Switch 2 版发售
      en: The Legend of Zelda: Ocarina of Time for Nintendo Switch 2
    summary:
      zh-CN: 经典《时之笛》面向 Nintendo Switch 2 的重制版本，2026 年 11 月 5 日发售。
      en: A rebuilt Nintendo Switch 2 version of the classic, releasing November 5, 2026.
    description:
      zh-CN: 任天堂确认本作于 2026 年 11 月 5 日登陆 Nintendo Switch 2；新版采用重制视觉、重新录制的音乐、现代化操作与全语音过场。
      en: Nintendo confirms a November 5, 2026 release on Nintendo Switch 2, with reimagined visuals, refreshed music, modernized controls and fully voiced cutscenes.
